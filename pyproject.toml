[project]
name = "predictiq"
version = "0.1.0"
description = "Self-healing remaining-useful-life prediction for turbofan engines (NASA N-CMAPSS)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "h5py",
    "pyarrow",
]

[dependency-groups]
explore = [
    "matplotlib",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predictiq"]