[project]
name = "predictiq"
version = "0.1.0"
description = "Self-healing remaining-useful-life prediction for turbofan engines (NASA N-CMAPSS)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "h5py",
    "pyarrow",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
explore = [
    "matplotlib",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predictiq"]
[tool.uv]
default-groups = ["dev", "explore"]   # plain `uv sync` installs both groups
# ---------- ruff: linter + formatter ----------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # basic style errors
    "F",       # real bugs: unused imports, undefined names
    "I",       # import order
    "B",       # common bug patterns
    "UP",      # use modern Python syntax
    "SIM",     # needlessly complicated code
    "S",       # security checks, e.g. hard-coded passwords
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]                           # assert is the point of a test
"experiments/**" = ["E501", "E402", "S", "B"]   # exploration scripts: looser rules

# ---------- mypy: type checking ----------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# ---------- pytest + coverage ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["predictiq"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
